<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:title" content="出发吧 GoTrip" />
    <meta property="og:description" content="和朋友一起规划每一次出发：行程、预算、清单、地图，一个都不少。" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>出发吧 GoTrip · 一起规划每一次出发</title>
    <script>
      // 尽早应用已保存的主题，避免夜间模式闪白
      try {
        var t = localStorage.getItem('gotrip_theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
